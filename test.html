<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Color Picker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#1e1e1e;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.picker{
    display:flex;
    flex-direction:column;
    gap:15px;
    width:280px;
}

#colorBox{
    width:250px;
    height:250px;
    position:relative;
    cursor:crosshair;
    border-radius:8px;
    overflow:hidden;
    background:hsl(0,100%,50%);
}

#colorBox .white{
    position:absolute;
    inset:0;
    background:linear-gradient(to right,#fff,transparent);
}

#colorBox .black{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,#000,transparent);
}

#selector{
    position:absolute;
    width:14px;
    height:14px;
    border:2px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    box-shadow:0 0 4px rgba(0,0,0,.8);
}

label{
    font-size:14px;
}

input[type=range]{
    width:250px;
}

#preview{
    width:80px;
    height:80px;
    border-radius:8px;
    border:2px solid white;
}

#colorValue{
    font-family:monospace;
    font-size:14px;
}
</style>

</head>
<body>

<div class="picker">

    <div id="colorBox">
        <div class="white"></div>
        <div class="black"></div>
        <div id="selector"></div>
    </div>

    <label>
        Hue
        <input id="hue" type="range" min="0" max="360" value="0">
    </label>

    <label>
        Alpha
        <input id="alpha" type="range" min="0" max="100" value="100">
    </label>

    <div id="preview"></div>

    <div id="colorValue"></div>

</div>

<script>

const box = document.getElementById("colorBox");
const selector = document.getElementById("selector");
const hue = document.getElementById("hue");
const alpha = document.getElementById("alpha");
const preview = document.getElementById("preview");
const colorValue = document.getElementById("colorValue");

let saturation = 1;
let brightness = 1;

function hsvToRgb(h,s,v){

    let c = v*s;
    let x = c*(1-Math.abs((h/60)%2-1));
    let m = v-c;

    let r=0,g=0,b=0;

    if(h<60){r=c;g=x;b=0;}
    else if(h<120){r=x;g=c;b=0;}
    else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;}
    else if(h<300){r=x;g=0;b=c;}
    else{r=c;g=0;b=x;}

    return {
        r:Math.round((r+m)*255),
        g:Math.round((g+m)*255),
        b:Math.round((b+m)*255)
    };

}

function updateColor(){

    box.style.background =
        `hsl(${hue.value},100%,50%)`;

    const rgb = hsvToRgb(
        Number(hue.value),
        saturation,
        brightness
    );

    const a = alpha.value/100;

    preview.style.background =
        `rgba(${rgb.r},${rgb.g},${rgb.b},${a})`;

    colorValue.textContent =
        `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${a.toFixed(2)})`;

}

function move(e){

    const rect = box.getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    x = Math.max(0,Math.min(rect.width,x));
    y = Math.max(0,Math.min(rect.height,y));

    selector.style.left = x+"px";
    selector.style.top = y+"px";

    saturation = x/rect.width;
    brightness = 1-(y/rect.height);

    updateColor();

}

box.addEventListener("pointerdown",e=>{

    move(e);

    function drag(ev){
        move(ev);
    }

    function stop(){

        window.removeEventListener("pointermove",drag);
        window.removeEventListener("pointerup",stop);

    }

    window.addEventListener("pointermove",drag);
    window.addEventListener("pointerup",stop);

});

hue.addEventListener("input",updateColor);
alpha.addEventListener("input",updateColor);

selector.style.left="250px";
selector.style.top="0px";

updateColor();

</script>

</body>
</html>
